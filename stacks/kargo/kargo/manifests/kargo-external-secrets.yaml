apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: idpbuilder-cacert
  namespace: kargo
spec:
  secretStoreRef:
    name: idpbuilder-cacert
    kind: ClusterSecretStore
  target:
    name: idpbuilder-cacert
  data:
    - secretKey: ca.crt
      remoteRef:
        key: idpbuilder-cert
        property: ca.crt