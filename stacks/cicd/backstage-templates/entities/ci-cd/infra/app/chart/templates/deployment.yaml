apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.appName }}
  namespace: "{{ .Values.appName }}-{{ .Values.envName }}"
  labels:
    entity-id: {{ .Values.appName }}
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
        entity-id: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.appName }}:{{ .Values.image.tag }}"
          ports:
          - containerPort: 8080
          env:
          - name: APP_ENV
            value: {{ .Values.envName }}
          - name: APP_VERSION
            value: {{ .Values.image.tag }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  strategy:
    canary:
      # Define service names for stable and canary
      stableService: {{ .Values.appName }}-stable
      canaryService: {{ .Values.appName }}-canary
      canaryMetadata:
        labels:
          role: canary
      # Canary steps with progressive weight increases
      analysis:
        templates:
        - templateName: "{{ .Values.serviceName }}"
          clusterScope: true
        startingStep: 2 # delay starting analysis run until setWeight: 50%
        args:
        - name: baseURL
          value: http://{{ .Values.appName }}-canary.{{ .Values.appName }}-{{ .Values.envName }}.svc.cluster.local:8080
        - name: subPath
          value: ""
        - name: field
          value: "dependencies.database"
        - name: value
          value: "connected"
      steps:
        - setWeight: 25
        - pause: {duration: 15s}
        - setWeight: 50
        - pause: {duration: 15s}
        - setWeight: 75
        - pause: {duration: 15s}
