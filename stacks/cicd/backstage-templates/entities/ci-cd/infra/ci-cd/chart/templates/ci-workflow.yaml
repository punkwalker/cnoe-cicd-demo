apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: "{{ .Values.serviceName }}-ci-template"
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: admin
  entrypoint: ci-build
  arguments:
    parameters:
      - name: apprepo
        value: "{{ .Values.giteaBaseUrl }}/{{ .Values.serviceName }}"
      - name: branch
        value: main
      # - name: deployrepo
      #   value: "{{ .Values.giteaBaseUrl }}/{{ .Values.serviceName }}-deploy"
      - name: image
        value: "{{ .Values.image.registry }}"
      - name: tag-version
        value: "0.0.1"
      - name: workflow-event-url
        value: "{{ .Values.hostName }}:8443/argo-workflows/api/v1/events/{{ .Values.namespace }}/"
  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
  templates:
    - name: ci-build
      dag:
        tasks:
          - name: clone
            template: clonerepo
            arguments:
              parameters:
                - name: apprepo
                  value: "{{`{{workflow.parameters.apprepo}}`}}"
                - name: branch
                  value: "{{`{{workflow.parameters.branch}}`}}"
          
          - name: build-and-push-image
            template: build-image-kaniko
            arguments:
              parameters:
                - name: image
                  value: "{{`{{workflow.parameters.image}}`}}"
                - name: tag-version
                  value: "{{`{{workflow.parameters.tag-version}}`}}"
            depends: "clone"
          # TODO: Add dynamic tag calculation
          - name: invoke-cd-workflow
            template: invoke-cd-workflow
            arguments:
              parameters:
                - name: workflow-event-url
                  value: "{{`{{workflow.parameters.workflow-event-url}}`}}"
                - name: image-tag
                  value: "{{`{{workflow.parameters.tag-version}}`}}"
                - name: app-name
                  value: "{{ .Values.serviceName }}"
            depends: "build-and-push-image"

    - name: clonerepo
      inputs:
        parameters:
          - name: apprepo
          - name: branch
      container:
        volumeMounts:
          - mountPath: /workdir
            name: workdir
        image: alpine/git:v2.45.1
        workingDir: /workdir
        args:
          - clone
          - --depth
          - "1"
          - --branch
          - "{{`{{inputs.parameters.branch}}`}}"
          - --single-branch
          - "{{`{{inputs.parameters.apprepo}}`}}"
          - -c
          - http.sslVerify=false
          - .

    - name: go-build
      container:
        image: golang:1.22
        volumeMounts:
          - mountPath: /workdir
            name: workdir
        workingDir: /workdir
        command:
          - go
        args:
          - build
          - -v
          - -o
          - myapp
    
    - name: build-image-kaniko
      inputs:
        parameters:
          - name: image
          - name: tag-version
      volumes:
        - name: docker-config
          configMap:
            name: docker-config
      container:
        image: gcr.io/kaniko-project/executor:latest
        volumeMounts:
          - name: workdir
            mountPath: /workdir
          - name: docker-config
            mountPath: /kaniko/.docker
        workingDir: /workdir
        resources:
          limits:
            cpu: 1
            memory: 2Gi
        env:
          - name: DOCKER_CONFIG
            value: /kaniko/.docker
        args:
          - --dockerfile=Dockerfile
          - --context=.
          - --destination={{`{{inputs.parameters.image}}`}}:{{`{{inputs.parameters.tag-version}}`}}
          - --skip-tls-verify
          - --cache=false
    
    - name: invoke-cd-workflow
      inputs:
        parameters:
          - name: workflow-event-url
          - name: image-tag
          - name: app-name
      container:
        image: alpine:3.20
        envFrom:
          - secretRef:
              name: gitea-credentials
        env:
          - name: ARGO_TOKEN
            valueFrom:
              secretKeyRef:
                name: argo-token
                key: token
        volumeMounts:
          - mountPath: /workdir
            name: workdir
        workingDir: "/workdir"
        command: ["/bin/sh"]
        args:
          - -c
          - >-
            set -x;
            [ -z "${ARGO_TOKEN:-}" ] && echo "Error: ARGO_TOKEN not set" && exit 1;
            apk add --no-cache curl jq;
            cd_workflow_url="https://{{`{{inputs.parameters.workflow-event-url}}`}}";
            image_tag="{{`{{inputs.parameters.image-tag}}`}}";
            app_name="{{`{{inputs.parameters.app-name}}`}}";
            for i in $(seq 1 3); do
                if curl -k -sf \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${ARGO_TOKEN}" \
                    -d "{\"image_tag\":\"${image_tag}\", \"app_name\":\"${app_name}\"}" \
                    "${cd_workflow_url}"; then
                    echo "CD workflow invoked successfully"
                    exit 0
                fi;
                [ $i -eq 3 ] && echo "All retries failed" && exit 1;
                echo "Attempt $i failed. Retrying..." && sleep 5;
            done
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowEventBinding
metadata:
  name: "{{ .Values.serviceName }}-ci-webhook"
  namespace: {{ .Values.namespace }}
spec:
  event:
    selector: metadata["x-gitea-event"] == ["push"]
  submit:
    workflowTemplateRef:
      name: "{{ .Values.serviceName }}-ci-template"
    arguments:
      parameters:
      - name: image-tag
        valueFrom:
          event: "payload.image_version"